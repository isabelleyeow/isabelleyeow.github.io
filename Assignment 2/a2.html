    <section class="hero">
      <video class="hero-bg" autoplay muted loop playsinline>
          <source src="./a2_files/your-video-placeholder.mp4" type="video/mp4">
      </video>

      <!-- home screen page, just a little landing page moment. the watch now button would bring users to the actual video -->
      <div class="hero-overlay">
        <div class="hero-text">
          <h1 class="hero-title">3 Monsters</h1>
              <p class="hero-subtitle">Adam Marchione — Music Video</p>
            <button class="hero-cta" onclick="document.querySelector('.media-player').scrollIntoView({behavior:'smooth'})">
            ▶ Watch Now
        </button>
        </div>
      </div>
    </section>

    <!-- Main Content Section -->

       <!-- lyric teaser! i want to show the viewers a little of the lyrics and then guiding them into a different tab for them to view the full lyrics. i think this really focuses on the interactivity part which i preferably like! -->
      <section class="lyrics-teaser">
        <p class="teaser-label">From the track</p>
          <blockquote class="teaser-lyric">
              "Opening lyric line goes here"
          </blockquote>
        <a href="lyrics.html" class="teaser-link">View full lyrics →</a>
      </section>
